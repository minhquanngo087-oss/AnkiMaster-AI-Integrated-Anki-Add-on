<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flashcards — Học từ vựng kiểu Anki</title>
<style>
:root{
    --bg:#f5f7fa; --card:#ffffff; --ink:#2c3e50; --ink-soft:#555;
    --muted:#7f8c8d; --line:#e0e6ed; --line-soft:#e9ecef;
    --blue:#007bff; --blue-deep:#0056b3; --blue-bg:#eaf4ff;
    --green:#28a745; --green-deep:#218838; --green-bg:#e8f5e9;
    --amber:#ff9800; --red:#e74c3c; --purple:#9b59b6; --teal:#1abc9c;
    --shadow:0 4px 12px rgba(0,0,0,.07); --shadow-lg:0 8px 24px rgba(0,0,0,.12);
    --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
    font-family:Arial, Helvetica, sans-serif;
    background:var(--bg); color:var(--ink);
    min-height:100vh; text-align:center;
    transition:background .3s,color .3s;
}
body.night{
    --bg:#121417; --card:#1e2126; --ink:#e8eaed; --ink-soft:#c4c7cc;
    --muted:#9aa0a6; --line:#33363c; --line-soft:#2a2d33;
    --blue:#5b9bd5; --blue-bg:#1d2a38; --green:#57bb8a; --green-bg:#1f2e27;
    --amber:#f4a736; --red:#ef5350; --purple:#b085d1; --teal:#45c6b0;
    --shadow:0 4px 12px rgba(0,0,0,.5); --shadow-lg:0 8px 24px rgba(0,0,0,.6);
}
button{font-family:inherit;}
.tappable{touch-action:manipulation;}

/* ---------- TOP BAR ---------- */
.topbar{
    max-width:720px; margin:0 auto; padding:14px 16px 6px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    text-align:left;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand .logo{
    width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#007bff,#764ba2);
    display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;
    box-shadow:0 3px 8px rgba(0,123,255,.35);
}
.brand .name{font-weight:bold;font-size:16px;color:var(--ink);}
.brand .sub{font-size:11px;color:var(--muted);}
.top-actions{display:flex;gap:8px;align-items:center;}
.icon-btn{
    width:38px;height:38px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);cursor:pointer;font-size:17px;
    display:flex;align-items:center;justify-content:center;transition:.15s;
}
.icon-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow);}
.icon-btn:active{transform:translateY(0);}

/* ---------- DECK / STATS BAR ---------- */
.statsbar{
    max-width:720px;margin:8px auto 12px;padding:0 16px;text-align:left;
    display:flex;align-items:center;gap:12px;
}
.deck-pill{
    font-size:12px;font-weight:bold;color:var(--blue);
    background:var(--blue-bg);border:1px solid transparent;padding:5px 12px;border-radius:20px;
}
.stat-mini{font-size:12px;color:var(--muted);}
.progress-track{
    max-width:720px;margin:0 auto 14px;padding:0 16px;
}
.progress-track .bar{
    height:8px;border-radius:6px;background:var(--line-soft);overflow:hidden;
}
.progress-track .fill{
    height:100%;width:0%;border-radius:6px;background:linear-gradient(90deg,#007bff,#764ba2);
    transition:width .4s ease;
}
.progress-track .label{
    display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:5px;
}

/* ---------- CARD ---------- */
.stage{max-width:720px;margin:0 auto;padding:0 16px 20px;}
.card{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:26px 24px;text-align:left;transition:background .3s,box-shadow .3s,transform .2s;
}
.card.flip{animation:cardIn .28s ease;}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* FRONT */
.word-and-tts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.word{font-size:40px;font-weight:bold;color:var(--ink);line-height:1.1;}
.ipa{font-size:18px;color:var(--muted);margin-top:4px;}
.pos-badge{
    display:inline-block;background-color:#3498db;color:#fff;padding:4px 12px;border-radius:15px;
    font-size:14px;margin-top:8px;font-weight:bold;
}
.content-section{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;
    margin-top:18px;
}
.front-label{
    font-size:12px;font-weight:bold;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;
}
.image-container{display:flex;justify-content:center;margin:4px 0 14px;}
.image-container .ph{
    width:100%;max-width:260px;aspect-ratio:1/1;border-radius:12px;
    display:flex;align-items:center;justify-content:center;font-size:88px;
    box-shadow:var(--shadow);border:1px solid var(--line);
}
.definition-en{font-style:italic;color:var(--ink-soft);margin-bottom:12px;font-size:1.08em;line-height:1.5;}
.definition-vi{
    font-size:22px;font-weight:bold;color:#2980b9;padding:12px 14px;border:1px solid var(--line);
    border-radius:12px;background:var(--blue-bg);line-height:1.4;
}

/* spell check */
.spell-check-input-container{
    margin-top:18px;padding:15px;border:1px solid var(--line);border-radius:12px;
    background:var(--card);
}
.spell-check-title{font-weight:bold;margin-bottom:10px;font-size:15px;color:var(--ink);}
.spell-check-input{
    width:100%;padding:13px 15px;margin-bottom:10px;border:2px solid var(--line);border-radius:10px;
    font-size:17px;box-sizing:border-box;background:var(--bg);color:var(--ink);outline:none;transition:.2s;
}
.spell-check-input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(76,175,80,.15);}
.spell-check-hint{font-size:13px;color:var(--muted);}
.spell-result{
    display:none;margin-top:12px;padding:12px;border-radius:10px;font-weight:bold;font-size:16px;
    line-height:1.5;
}
.spell-result.ok{display:block;background:var(--green-bg);color:#1b5e20;border-left:4px solid var(--green);}
.spell-result.bad{display:block;background:#fff3e0;color:#5d4037;border-left:4px solid var(--amber);}
body.night .spell-result.ok{color:#7ee2a8;}
body.night .spell-result.bad{color:#ffd08a;}

/* show answer */
.show-answer-wrap{display:flex;justify-content:center;margin-top:18px;}
.show-answer-btn{
    padding:16px 40px;background:linear-gradient(135deg,#28a745,#1e7e34);color:#fff;border:none;
    border-radius:12px;font-size:20px;font-weight:bold;cursor:pointer;transition:.2s;
    box-shadow:0 4px 12px rgba(40,167,69,.35);min-width:220px;text-align:center;
}
.show-answer-btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(40,167,69,.45);}
.show-answer-btn:active{transform:translateY(0);}

/* BACK */
.kbd-hint{font-size:12px;color:var(--muted);text-align:center;margin-top:10px;}

/* TTS */
.tts-btn{
    cursor:pointer;background:#4CAF50;border:none;border-radius:50%;width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;transition:.15s;font-size:17px;color:#fff;
    box-shadow:0 2px 5px rgba(0,0,0,.2);flex-shrink:0;
}
.tts-btn:hover{background:#45a049;transform:scale(1.08);}
.tts-btn.playing{background:#ff9800;animation:pulse 1s infinite;}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}

/* tabs */
.tabs{
    display:flex;flex-wrap:wrap;gap:6px;margin-top:20px;padding:6px;
    background:var(--line-soft);border-radius:14px;
}
.tab-link{
    flex:1;min-width:110px;border:none;background:transparent;padding:11px 8px;cursor:pointer;
    font-size:14px;font-weight:bold;color:var(--ink-soft);transition:.2s;border-radius:10px;
}
.tab-link.active{background:var(--blue);color:#fff;box-shadow:0 3px 8px rgba(0,123,255,.3);}
.tab-link:hover:not(.active){background:var(--line);}
.tab-content{
    display:none;background:var(--card);border:1px solid var(--line);padding:18px;
    border-radius:14px;box-shadow:var(--shadow);text-align:left;margin-top:10px;
}
.tab-content.active{display:block;animation:cardIn .2s ease;}

.item-title,.group-title{font-weight:bold;font-size:1.05em;margin-bottom:10px;color:var(--ink);}
.tab-item{padding:14px;margin:10px 0;border-radius:10px;background:var(--bg);}
.tab-item-group{margin:14px 0;padding-left:14px;border-left:4px solid var(--line);}
.item-content{color:var(--ink-soft);line-height:1.5;font-size:1.05em;}

/* lists */
.item-list{margin-bottom:12px;}
.item-list-word{font-weight:bold;font-size:1.08em;color:#d63384;}
.item-list-pos{font-style:italic;font-size:.85em;color:var(--muted);}
.item-list-example{font-style:italic;color:var(--ink-soft);padding-left:10px;margin-top:3px;}
.item-list-translation{color:#28a745;font-style:italic;padding-left:10px;margin-top:3px;}

/* recommendation */
.recommend-use{border-left:4px solid #20c997;background:var(--green-bg);}
.recommend-avoid{border-left:4px solid #fd7e14;background:#fff3e0;}
.learning-tip{border-left:4px solid #ffc107;background:var(--blue-bg);}
.memory-aid{border-left:4px solid #9C27B0;background:#f3e5f5;}
body.night .memory-aid{background:#2a2133;}
.no-data{color:var(--muted);font-style:italic;text-align:center;padding:16px;}

/* exercises */
.exercise-item{border:1px solid var(--line);border-radius:10px;padding:15px;margin:10px 0;background:var(--bg);}
.exercise-item.correct{border-color:var(--green);}
.exercise-item.incorrect{border-color:var(--red);}
.exercise-type{font-size:.78em;font-weight:bold;color:#fff;background:var(--amber);padding:2px 9px;border-radius:10px;}
.exercise-question{font-size:1.05em;color:var(--ink);margin:10px 0;line-height:2;}
.exercise-input{display:inline-block;vertical-align:baseline;border:2px solid var(--line);border-radius:7px;
    padding:4px 9px;font-size:1em;font-weight:bold;text-align:center;min-width:110px;background:var(--card);color:var(--ink);}
.exercise-input:focus{outline:none;border-color:var(--blue);}
.exercise-controls{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.chk-btn,.ans-btn{border:none;padding:8px 14px;border-radius:8px;font-weight:bold;cursor:pointer;color:#fff;font-size:14px;}
.chk-btn{background:var(--blue);}
.ans-btn{background:#6c757d;}
.exercise-feedback{margin-top:10px;font-size:.95em;line-height:1.5;}
.exercise-explanation{background:var(--line-soft);border-left:4px solid #6c757d;padding:12px;border-radius:8px;margin-top:10px;color:var(--ink-soft);}

/* reading */
.rd-passage{background:var(--bg);border-left:4px solid #3498db;border-radius:10px;padding:14px 16px;line-height:1.7;}
.rd-title{font-weight:bold;font-size:1.1em;margin-bottom:8px;color:var(--ink);}
.rd-text{line-height:1.8;font-size:1.02em;color:var(--ink);}
.rd-key{background:#fff3cd;color:#c0392b;font-weight:bold;border-radius:3px;padding:0 3px;}
.rd-translation{background:var(--green-bg);border-radius:8px;padding:10px 12px;margin-top:10px;color:#33691e;line-height:1.6;}
body.night .rd-translation{color:#9fdcb0;}
.rd-q{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;}
.rd-q-text{font-weight:bold;color:var(--ink);margin-bottom:8px;}
.rd-opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;
    padding:9px 12px;margin:5px 0;font-size:14px;cursor:pointer;color:var(--ink);transition:.15s;}
.rd-opt:hover{border-color:var(--blue);}
.rd-opt.right{background:var(--green-bg);border-color:var(--green);color:#1b5e20;font-weight:bold;}
.rd-opt.wrong{background:#ffebee;border-color:var(--red);color:#b71c1c;}
.rd-opt:disabled{cursor:default;}
.rd-q-fb{font-size:14px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}

/* sentence practice */
.sp-levels{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.sp-level{flex:1;min-width:80px;padding:9px 6px;border:2px solid #c8e6c9;border-radius:9px;background:var(--card);
    color:#2e7d32;font-weight:bold;font-size:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;}
.sp-level small{font-weight:normal;font-size:11px;color:var(--muted);}
.sp-level.active{background:#4CAF50;border-color:#4CAF50;color:#fff;}
.sp-level.active small{color:#e8f5e9;}
.sp-task{background:var(--card);border-left:4px solid #2196F3;border-radius:10px;padding:13px;margin:10px 0;}
.sp-task-label{font-size:12px;font-weight:bold;color:#1565c0;text-transform:uppercase;margin-bottom:6px;}
.sp-task-text{font-size:1.05em;color:var(--ink);line-height:1.55;}
.sp-phrase{display:inline-block;margin:8px 0;padding:7px 13px;background:#fff3cd;border:2px dashed var(--amber);
    border-radius:9px;font-size:1.15em;font-weight:bold;color:#e65100;}
.sp-input{width:100%;box-sizing:border-box;padding:12px;border:2px solid var(--line);border-radius:10px;
    font-size:16px;line-height:1.5;font-family:inherit;resize:vertical;min-height:74px;background:var(--card);color:var(--ink);}
.sp-input:focus{outline:none;border-color:var(--green);}
.sp-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.sp-btn{flex:1;min-width:100px;padding:11px 14px;border:none;border-radius:9px;font-weight:bold;font-size:14px;cursor:pointer;color:#fff;}
.sp-btn:disabled{opacity:.5;cursor:not-allowed;}
.sp-btn-new{background:#2196F3;}
.sp-btn-check{background:#4CAF50;}
.sp-btn-reveal{background:#9e9e9e;}
.sp-result{margin-top:12px;}
.sp-verdict{padding:12px;border-radius:9px;margin-bottom:8px;line-height:1.5;}
.sp-verdict.pass{background:var(--green-bg);border-left:4px solid var(--green);color:#1b5e20;}
.sp-verdict.fail{background:#fff3e0;border-left:4px solid var(--amber);color:#5d4037;}
body.night .sp-verdict.pass{color:#7ee2a8;}
body.night .sp-verdict.fail{color:#ffd08a;}
.sp-answer{background:var(--card);border-left:4px solid var(--green);border-radius:9px;padding:11px 13px;margin-bottom:8px;}

/* rating buttons */
.rating-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px;}
.rate-btn{
    border:none;border-radius:12px;padding:13px 8px;font-weight:bold;color:#fff;cursor:pointer;
    font-size:15px;transition:.15s;box-shadow:var(--shadow);
    display:flex;flex-direction:column;align-items:center;gap:2px;
}
.rate-btn small{font-weight:normal;font-size:11px;opacity:.9;}
.rate-btn:hover{transform:translateY(-2px);filter:brightness(1.05);}
.rate-btn:active{transform:translateY(0);}
.rate-again{background:#e74c3c;}
.rate-hard{background:#f0a30a;}
.rate-good{background:#28a745;}
.rate-easy{background:#2196F3;}

/* context section */
.context-section{background:var(--blue-bg);padding:14px;border-radius:10px;margin:10px 0;border-left:4px solid #2196F3;}
.context-title{font-weight:bold;color:#1565c0;margin-bottom:8px;font-size:1.05em;}
.context-content{color:var(--ink);line-height:1.5;white-space:pre-wrap;background:var(--card);padding:10px;border-radius:8px;}

/* other meaning */
.other-meaning-item{background:var(--bg);padding:13px;margin:10px 0;border-radius:9px;border-left:4px solid var(--amber);}
.other-meaning-header{display:flex;align-items:flex-start;margin-bottom:8px;}
.other-meaning-index{background:var(--amber);color:#fff;border-radius:50%;width:24px;height:24px;display:flex;
    align-items:center;justify-content:center;font-weight:bold;margin-right:10px;flex-shrink:0;font-size:13px;}
.other-meaning-text{font-weight:bold;color:var(--ink);font-size:1.05em;}
.om-row{margin:6px 0;padding:7px 9px;background:var(--card);border-radius:7px;font-size:.92em;line-height:1.45;}
.om-row b{color:var(--blue);}

/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);max-width:90%;padding:12px 18px;
    border-radius:12px;font-weight:bold;box-shadow:var(--shadow-lg);z-index:999;display:none;text-align:center;}

/* footer */
.footer{max-width:720px;margin:0 auto 30px;padding:0 16px;font-size:11px;color:var(--muted);text-align:center;}

@media (max-width:600px){
    .card{padding:20px 16px;}
    .word{font-size:32px;}
    .rating-bar{grid-template-columns:repeat(4,1fr);gap:6px;}
    .rate-btn{font-size:13px;padding:11px 4px;}
}
</style>
</head>
<body>

<div class="topbar">
    <div class="brand">
        <div class="logo">📚</div>
        <div>
            <div class="name">Flashcards</div>
            <div class="sub">Học từ vựng kiểu Anki</div>
        </div>
    </div>
    <div class="top-actions">
        <button class="icon-btn" id="home-btn" title="Về trang chủ" style="display:none;">🏠</button>
        <button class="icon-btn" id="night-btn" title="Chế độ tối">🌙</button>
    </div>
</div>

<div id="statsbar" class="statsbar" style="display:none;">
    <span class="deck-pill" id="deck-name">Bộ từ vựng</span>
    <span class="stat-mini" id="stat-new">🆕 Mới: 0</span>
    <span class="stat-mini" id="stat-due">🔁 Ôn: 0</span>
</div>
<div id="progress" class="progress-track" style="display:none;">
    <div class="bar"><div class="fill" id="progress-fill"></div></div>
    <div class="label"><span id="progress-count">0 / 0</span><span id="progress-pct">0%</span></div>
</div>

<div class="stage" id="stage">
    <!-- Card content rendered here -->
</div>

<div class="footer">
    ⏎ / Space để hiện đáp án · 1-4 chấm điểm · Dữ liệu mẫu dựa trên template add-on Gemini Flashcard Generator
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   DATA — khớp cấu trúc field của add-on (FIELD_MAP trong main.py)
   Các field phức tạp lưu dạng object/array trực tiếp để tiện render.
   ========================================================================= */
const DECK_NAME = "Bộ từ vựng tiếng Anh (mẫu)";

const CARDS = [
{
  word:"serendipity", ipa:"/ˌserənˈdɪpəti/", pos:"noun",
  definition_en:"(LUCKY FIND) the fact of finding interesting or valuable things by chance",
  definition_vi:"sự tình cờ may mắn",
  image:["#667eea","#764ba2","🍀"],
  context:"education",
  example_en:"Meeting my best friend at that little café was pure serendipity.",
  example_vi:"Gặp người bạn thân nhất ở quán cà phê nhỏ đó hoàn toàn là một sự tình cờ may mắn.",
  synonyms:[
    {word:"chance", pos:"noun", meaning_vi:"sự tình cờ", example_en:"It happened by chance.", example_vi:"Chuyện đó xảy ra một cách tình cờ."},
    {word:"fortune", pos:"noun", meaning_vi:"vận may", example_en:"By good fortune, she found her ring.", example_vi:"May mắn thay, cô ấy tìm lại được chiếc nhẫn."}
  ],
  antonyms:[
    {word:"misfortune", pos:"noun", meaning_vi:"sự bất hạnh", example_en:"He blamed his misfortune on bad luck.", example_vi:"Anh ta đổ lỗi sự bất hạnh của mình cho vận rủi."}
  ],
  word_family:[
    {word:"serendipitous", pos:"adjective", meaning_vi:"tình cờ may mắn"},
    {word:"serendipitously", pos:"adverb", meaning_vi:"một cách tình cờ may mắn"}
  ],
  collocations:[
    {phrase:"pure serendipity", meaning_vi:"hoàn toàn tình cờ", example_en:"It was pure serendipity.", example_vi:"Đó hoàn toàn là sự tình cờ."},
    {phrase:"a stroke of serendipity", meaning_vi:"một cú tình cờ may mắn", example_en:"The discovery was a stroke of serendipity.", example_vi:"Khám phá đó là một cú tình cờ may mắn."}
  ],
  phrasal_verbs:[],
  idioms:[
    {phrase:"happy accident", meaning_vi:"sự cố vui vẻ (kết quả tình cờ tốt đẹp)", example_en:"The recipe was a happy accident.", example_vi:"Công thức đó là một sự cố vui vẻ."}
  ],
  other_meaning:[
    {meaning:"sự may mắn tình cờ trong khám phá", context_vi:"dùng khi nói về khám phá khoa học, tình yêu, công việc", example_en:"Serendipity played a role in many great discoveries.", example_vi:"Sự tình cờ may mắn góp phần vào nhiều khám phá vĩ đại."}
  ],

    if(!text) return 'en';
    if(/[\u4e00-\u9fff]/.test(text)) return 'zh-CN';
    if(/[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/i.test(text)) return 'vi-VN';
    if(/[\u3040-\u30ff]/.test(text)) return 'ja-JP';
    return 'en-GB';
}

function toast(msg){
    const t = $('#toast');
    t.textContent = msg; t.style.display = 'block';
    clearTimeout(t.__timer);
    t.__timer = setTimeout(()=> t.style.display='none', 2600);
}

/* =========================================================================
   TTS (Web Speech API — an toàn, không cần API key)
   ========================================================================= */
let ttsBtnEl = null;
function speak(text, ev){
    if(!text) return;
    if(!('speechSynthesis' in window)){ toast('🔇 Trình duyệt không hỗ trợ đọc giọng'); return; }
    const clean = text.replace(/[\(\[\{\<][^\)\]\}\>]*[\)\]\}\>]/g,'').trim() || text;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = detectLang(clean);
    u.rate = 0.9;
    const voices = window.speechSynthesis.getVoices();
    const v = voices.find(x=>x.lang===u.lang) || voices.find(x=>x.lang.startsWith(u.lang.split('-')[0]));
    if(v) u.voice = v;

    let btn = ev && ev.target ? (ev.target.closest ? ev.target.closest('button') : null) : null;
    if(btn){ btn.classList.add('playing'); }
    u.onend = u.onerror = () => { if(btn) btn.classList.remove('playing'); };
    window.speechSynthesis.speak(u);
}

function listSection(title, arr, opts){
    if(!arr || !arr.length) return '';
    const rows = arr.map(it=>{
        if(!it) return '';
        const word = opts && opts.wordKey ? it[opts.wordKey] : it.word || it.phrase;
        const pos = it.pos ? ` <span class="item-list-pos">(${esc(it.pos)})</span>` : '';
        const mv = it.meaning_vi ? ` — ${esc(it.meaning_vi)}` : '';
        const ex = it.example_en ? `<div class="item-list-example">${esc(it.example_en)}</div>` : '';
        const tr = it.example_vi ? `<div class="item-list-translation">${esc(it.example_vi)}</div>` : '';
        return `<div class="item-list"><span class="item-list-word">${esc(word)}</span>${pos}${mv}${ex}${tr}</div>`;
    }).join('');
    return `<div class="tab-item-group"><div class="group-title">${title}</div>${rows}</div>`;
}

function otherMeaningSection(arr){

function checkExercise(i){
    const input = $(`.exercise-input[data-ex="${i}"]`);
    const item = $(`#ex-${i}`);
    const fb = $(`#ex-fb-${i}`);
    if(!input){ return; }
    const ans = CARDS[current].exercises[i].answer.toLowerCase();
    const val = input.value.trim().toLowerCase();
    if(val === ans){
        item.className = 'exercise-item correct';
        fb.innerHTML = `<div class="exercise-explanation"><strong>✅ Chính xác!</strong> ${esc(CARDS[current].exercises[i].explanation||'')}</div>`;
    } else {
        item.className = 'exercise-item incorrect';
        fb.innerHTML = `<div class="exercise-explanation"><strong>❌ Chưa đúng.</strong> Đáp án: <b>${esc(CARDS[current].exercises[i].answer)}</b><br>${esc(CARDS[current].exercises[i].explanation||'')}</div>`;
    }
}

function showExerciseAnswer(i){
    const input = $(`.exercise-input[data-ex="${i}"]`);
    if(input) input.value = CARDS[current].exercises[i].answer;
    checkExercise(i);
}

let readingAnswered = {};
function answerReading(qi, oi){
    const q = CARDS[current].reading.questions[qi];
    const correct = q.correctAnswer;
    const opts = $(`#rdq-${qi}`).querySelectorAll('.rd-opt');
    opts.forEach((o,idx)=>{
        o.disabled = true;
        if(idx === correct) o.classList.add('right');
        if(idx === oi && oi !== correct) o.classList.add('wrong');
    });
    const fb = $(`#rdq-fb-${qi}`);
    fb.innerHTML = (oi===correct ? '✅ Đúng! ' : '❌ Sai. ') + esc(q.explanation||'');
}

/* =========================================================================
   FLOW
   ========================================================================= */
function buildQueue(){
    queue = CARDS.map((_,i)=>i);
    // xáo nhẹ để mỗi lần khác thứ tự (Anki cũng trộn thẻ mới)
    for(let i=queue.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [queue[i],queue[j]]=[queue[j],queue[i]]; }
    pos = 0;
    stats.new = queue.length; stats.due = 0; stats.reviewed = 0;
}

function render(){
    const stage = $('#stage');
    if(pos >= queue.length){
        stage.innerHTML = `
        <div class="card flip" style="text-align:center;padding:50px 24px;">
            <div style="font-size:56px;">🎉</div>
            <h2 style="color:var(--ink);margin:14px 0 6px;">Hoàn tất buổi ôn!</h2>
            <p style="color:var(--muted);">Bạn đã ôn xong ${stats.reviewed} thẻ trong bộ từ vựng.</p>
            <button class="show-answer-btn" onclick="startReview()" style="min-width:0;font-size:16px;padding:13px 30px;">🔁 Ôn lại bộ này</button>
        </div>`;
        $('#progress').style.display='none';
        $('#statsbar').style.display='none';
        return;
    }
    current = queue[pos];
    flipped = false;
    readingAnswered = {};
    $('#statsbar').style.display='flex';
    $('#progress').style.display='block';
    $('#deck-name').textContent = DECK_NAME;
    $('#stat-new').textContent = `🆕 Mới: ${queue.length - pos}`;
    $('#stat-due').textContent = `🔁 Đã ôn: ${stats.reviewed}`;
    updateProgress();
    stage.innerHTML = renderFront(CARDS[current]);
    bindFront();
}

function updateProgress(){
    $('#progress-fill').style.width = (stats.reviewed / queue.length * 100) + '%';
    $('#progress-count').textContent = `${stats.reviewed} / ${queue.length}`;
    $('#progress-pct').textContent = Math.round(stats.reviewed/queue.length*100) + '%';
}

function bindFront(){
    const btn = $('#showAnswerBtn');
    btn.onclick = flip;
    const input = $('#spellCheckInput');
    input.addEventListener('keydown', e=>{
        if(e.key === 'Enter'){ e.preventDefault(); flip(); }
    });
    input.focus();
}

function flip(){
    if(flipped) return;
    flipped = true;
    const input = $('#spellCheckInput');
    let guess = input ? input.value.trim() : '';
    const card = CARDS[current];
    $('#stage').innerHTML = renderBack(card);
    bindTabs();
    spRenderLevels(); spRenderTask();
    if(guess){
        // kiểm tra chính tả
        const norm = s => s.toLowerCase().replace(/\s+/g,' ').trim();
        const g = norm(guess), a = norm(card.word);
        const close = g === a || (g.length>1 && a.includes(g)) || (a.length>1 && g.includes(a));
        const result = close
            ? `<div class="spell-result ok">✅ Chính xác! Bạn đã viết đúng từ "${esc(card.word)}".</div>`
            : `<div class="spell-result bad">✏️ Bạn viết "${esc(guess)}" — từ đúng là "${esc(card.word)}".</div>`;
        const wordSection = $('#stage .word-section');
        if(wordSection) wordSection.insertAdjacentHTML('afterend', result);
    }
    window.scrollTo({top:0, behavior:'smooth'});
}

function bindTabs(){
    document.querySelectorAll('.tab-link').forEach(btn=>{
        btn.onclick = ()=>{
            document.querySelectorAll('.tab-link').forEach(b=>b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
            btn.classList.add('active');
            const t = document.getElementById(btn.dataset.tab);
            if(t) t.classList.add('active');
        };
    });
}

function rate(r){
    stats.reviewed++;
    pos++;
    const msg = {again:'🔁 Sẽ gặp lại sau 1 phút', hard:'🤔 Sẽ gặp lại sau 6 phút', good:'😊 Sẽ gặp lại sau 10 phút', easy:'🚀 Sẽ gặp lại sau 4 ngày'}[r];
    toast(msg);
    render();
}

function startReview(){
    buildQueue();
    render();
}

/* =========================================================================
   KEYBOARD + GLOBAL
   ========================================================================= */
document.addEventListener('keydown', e=>{
    if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if(e.key === ' ' || e.key === 'Enter'){
        e.preventDefault();
        if(!flipped && $('#showAnswerBtn')) flip();
    } else if(flipped){
        const map = {'1':'again','2':'hard','3':'good','4':'easy'};
        if(map[e.key]) rate(map[e.key]);
    }
});

$('#night-btn').onclick = function(){
    document.body.classList.toggle('night');
    this.textContent = document.body.classList.contains('night') ? '☀️' : '🌙';
};

/* =========================================================================
   START
   ========================================================================= */
startReview();
</script>
